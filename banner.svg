<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">StreamX API — Keyless movie &amp; TV metadata API</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ff3b47" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ff3b47" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 900 92px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:-0.04em; fill:#fff; }
      .x { font: 900 104px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:-0.04em; fill:#ff3b47; }
      .sub { font: 600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#9aa0b4; letter-spacing:0.02em; }
      .pill { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#7ee0a6; text-anchor:middle; letter-spacing:0.12em; text-transform:uppercase; }
      .credit { font: 500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#6b7388; letter-spacing:0.08em; text-transform:uppercase; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="900" cy="180" r="320" fill="url(#glow)"/>
  <g>
    <text x="120" y="280">
      <tspan class="title">Stream</tspan><tspan class="x">X</tspan><tspan class="title"> API</tspan>
    </text>
    <text x="120" y="340" class="sub">Keyless movie &amp; TV metadata — posters, scores, credits, similar, streaming</text>
    <text x="120" y="380" class="sub">Self-host on Cloudflare · Vercel · Railway · Render · Docker</text>
    <g>
      <rect x="120" y="420" rx="999" ry="999" width="192" height="32" fill="none" stroke="#2a4133" stroke-width="1"/>
      <text x="216" y="441" class="pill">No API key required</text>
    </g>
    <text x="120" y="540" class="credit">by imzyrix · part of zyrixdevs</text>
    <text x="120" y="560" class="credit">MIT (code) · CC BY 4.0 (docs)</text>
  </g>
</svg>
