<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">StreamX API — Keyless movie &amp; TV metadata API</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ff3b47" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#ff3b47" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#ff3b47" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#ff3b47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b47"/>
      <stop offset="100%" stop-color="#ff6a3d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      .title { font: 900 110px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; letter-spacing:-0.05em; fill:#fff; }
      .x { font: 900 126px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; letter-spacing:-0.06em; fill:#ff3b47; }
      .sub { font: 600 24px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; fill:#a6a9b8; letter-spacing:-0.01em; opacity:0; }
      .pill { font: 700 12px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; fill:#7ee0a6; letter-spacing:0.16em; text-transform:uppercase; }
      .credit { font: 600 11px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; fill:#6b7388; letter-spacing:0.12em; text-transform:uppercase; opacity:0; }
      .bar { fill:none; stroke:url(#bar); stroke-width:3; stroke-linecap:round; stroke-dasharray:520; stroke-dashoffset:520; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="260" cy="200" r="320" fill="url(#glow1)"/>
  <circle cx="1040" cy="140" r="280" fill="url(#glow2)"/>
  <g>
    <text x="120" y="300">
      <tspan class="title">Stream</tspan><tspan class="x">X</tspan><tspan class="title"> API</tspan>
    </text>
    <path class="bar" d="M120 330 H 640">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </path>
    <text x="120" y="380" class="sub">
      Keyless movie &amp; TV metadata — posters, scores, credits, similar &amp; streaming
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.8s" fill="freeze"/>
    </text>
    <text x="120" y="420" class="sub">
      Self-host on Cloudflare · Vercel · Railway · Render · Docker
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.0s" fill="freeze"/>
    </text>
    <g>
      <rect x="120" y="460" rx="999" ry="999" width="210" height="30" fill="rgba(126,224,166,0.08)" stroke="#2a4133" stroke-width="1"/>
      <text x="225" y="479" class="pill">No API key required</text>
    </g>
    <text x="120" y="540" class="credit">
      @imzyrix · @zyrixdevs · MIT (code) · CC BY 4.0 (docs)
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.4s" fill="freeze"/>
    </text>
  </g>
</svg>
